<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 230" width="100%" height="230">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c10"/>
      <stop offset="50%" stop-color="#0f141c"/>
      <stop offset="100%" stop-color="#07090d"/>
    </linearGradient>

    <!-- Crimson Glow Gradient -->
    <linearGradient id="redGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="50%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>

    <!-- Accent Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#3b0764" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#dc2626" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Radial Glow Behind Shield -->
    <radialGradient id="shieldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="gridPattern" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.04"/>
    </pattern>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.7; }
      50% { opacity: 1; }
    }
    @keyframes scanline {
      0% { transform: translateY(0); }
      100% { transform: translateY(230px); }
    }
    .glimmer { animation: pulseGlow 3s ease-in-out infinite; }
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; }
    .sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  </style>

  <!-- Base Card -->
  <rect width="900" height="230" rx="14" fill="url(#bgGrad)"/>
  <rect width="900" height="230" rx="14" fill="url(#gridPattern)"/>
  <rect width="900" height="230" rx="14" fill="none" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- Left Accent Tech Line -->
  <rect x="0" y="40" width="4" height="150" fill="url(#redGlow)" rx="2"/>

  <!-- Glow behind Shield -->
  <circle cx="105" cy="115" r="75" fill="url(#shieldGlow)"/>

  <!-- Cyber Shield Icon -->
  <g transform="translate(65, 75)" filter="url(#glow)">
    <!-- Outer Shield Hex -->
    <path d="M 40 5 L 75 18 L 75 52 C 75 68 58 80 40 85 C 22 80 5 68 5 52 L 5 18 Z" 
          fill="#161b24" stroke="#ef4444" stroke-width="2.5"/>
    <!-- Inner Shield Accent -->
    <path d="M 40 14 L 66 24 L 66 50 C 66 61 53 71 40 75 C 27 71 14 61 14 50 L 14 24 Z" 
          fill="#1c2432" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="3,2"/>
    <!-- Terminal Prompt / Key Icon inside -->
    <path d="M 28 36 L 37 45 L 28 54" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="42" y1="54" x2="52" y2="54" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Top Status Pill -->
  <g transform="translate(180, 42)">
    <rect width="185" height="22" rx="11" fill="#18202c" stroke="#ef4444" stroke-width="1" stroke-opacity="0.6"/>
    <circle cx="12" cy="11" r="4" fill="#39ff88"/>
    <text x="24" y="15" fill="#e2e8f0" font-size="10.5" font-weight="600" class="mono" letter-spacing="0.08em">VAPT &amp; SECURITY LAB</text>
  </g>

  <!-- Name -->
  <text x="180" y="98" fill="#ffffff" font-size="34" font-weight="800" class="sans" letter-spacing="-0.02em">
    SIVA PRASATH L
  </text>

  <!-- Focus / Tagline -->
  <text x="180" y="126" fill="#ef4444" font-size="13.5" font-weight="700" class="mono" letter-spacing="0.12em">
    ETHICAL HACKER // CYBERSECURITY PROFESSIONAL // VAPT
  </text>

  <!-- College & Location Meta -->
  <g transform="translate(180, 150)">
    <!-- College Pill -->
    <rect width="365" height="26" rx="5" fill="#111822" stroke="#2a3444" stroke-width="1"/>
    <text x="12" y="17" fill="#cbd5e1" font-size="11.5" class="sans" font-weight="500">
      🎓 Sri Shakthi Institute of Engineering &amp; Technology
    </text>

    <!-- Location Pill -->
    <g transform="translate(375, 0)">
      <rect width="165" height="26" rx="5" fill="#111822" stroke="#2a3444" stroke-width="1"/>
      <text x="10" y="17" fill="#cbd5e1" font-size="11.5" class="sans" font-weight="500">
        📍 Coimbatore, India
      </text>
    </g>

    <!-- Year Pill -->
    <g transform="translate(550, 0)">
      <rect width="115" height="26" rx="5" fill="#1f1418" stroke="#ef4444" stroke-width="1" stroke-opacity="0.7"/>
      <text x="10" y="17" fill="#f87171" font-size="11.5" class="mono" font-weight="600">
        🛡️ 3rd Year
      </text>
    </g>
  </g>

  <!-- Bottom Cyber Decors -->
  <g transform="translate(180, 195)">
    <line x1="0" y1="0" x2="685" y2="0" stroke="#1f2937" stroke-width="1"/>
    <line x1="0" y1="0" x2="160" y2="0" stroke="#ef4444" stroke-width="2"/>
    <circle cx="160" cy="0" r="3" fill="#ef4444"/>
    <text x="685" y="14" text-anchor="end" fill="#64748b" font-size="9.5" class="mono" letter-spacing="0.1em">
      SYSTEM_STATE: SECURE // ROLE: ETHICAL HACKER
    </text>
  </g>
</svg>
